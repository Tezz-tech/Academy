<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PollReady — Programme Administration</title>
<style>
:root{
  --ink:#10241D;
  --ink-2:#183328;
  --ink-3:#20422F;
  --green:#1B6B4A;
  --green-l:#2E8A62;
  --brass:#B8863B;
  --brick:#A8432C;
  --paper:#F1F3F0;
  --card:#FFFFFF;
  --line:#DBDED8;
  --line-2:#E9EBE6;
  --tx:#17201C;
  --tx-2:#5C6560;
  --tx-3:#8A928C;
  --blue:#2F5D82;
  --serif:Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--tx);
  font-size:13px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  display:flex;
  overflow:hidden;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--green-l);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------------- SIDEBAR ---------------- */
#side{
  width:224px;flex:0 0 224px;background:var(--ink);color:#CBD6CF;
  display:flex;flex-direction:column;height:100vh;
}
.brand{padding:19px 18px 17px;border-bottom:1px solid rgba(255,255,255,.09);display:flex;gap:10px;align-items:center}
.mark{
  width:31px;height:31px;flex:0 0 31px;border-radius:5px;background:var(--green);
  display:flex;align-items:center;justify-content:center;
}
.mark svg{width:17px;height:17px}
.brand .nm{font-family:var(--serif);font-size:16.5px;color:#fff;letter-spacing:.2px;line-height:1.1}
.brand .sb{font-size:9.5px;color:#7F9689;letter-spacing:.5px;margin-top:1px}

.navwrap{flex:1;overflow-y:auto;padding:12px 0}
.navgrp{margin-bottom:16px}
.navgrp h6{font-size:9.5px;color:#6D8478;font-weight:600;letter-spacing:.7px;padding:0 18px 6px;text-transform:uppercase}
.nv{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:7px 18px 7px 15px;color:#B9C8C0;border-left:3px solid transparent;font-size:12.5px;
}
.nv:hover{background:rgba(255,255,255,.045);color:#fff}
.nv.on{background:rgba(46,138,98,.18);border-left-color:var(--green-l);color:#fff;font-weight:600}
.nv svg{width:15px;height:15px;flex:0 0 15px;opacity:.85}
.nv .badge{
  margin-left:auto;background:var(--brick);color:#fff;font-size:9.5px;font-weight:700;
  padding:1px 5px;border-radius:8px;min-width:17px;text-align:center
}
.sidefoot{border-top:1px solid rgba(255,255,255,.09);padding:12px 16px;display:flex;gap:9px;align-items:center}
.av{width:29px;height:29px;flex:0 0 29px;border-radius:50%;background:var(--brass);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px}
.sidefoot .who{font-size:11.5px;color:#fff;line-height:1.25}
.sidefoot .rl{font-size:10px;color:#7F9689}

/* ---------------- MAIN ---------------- */
#main{flex:1;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.topbar{
  background:#fff;border-bottom:1px solid var(--line);padding:0 22px;
  display:flex;align-items:center;gap:16px;height:54px;position:sticky;top:0;z-index:40;flex:0 0 54px
}
.crumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx-2)}
.crumb b{color:var(--tx);font-weight:600}
.crumb .sep{color:var(--tx-3)}
.scope{
  display:flex;align-items:center;gap:7px;background:var(--paper);border:1px solid var(--line);
  border-radius:4px;padding:5px 9px;font-size:11.5px;color:var(--tx-2)
}
.scope select{
  border:none;background:none;font-family:inherit;font-size:11.5px;color:var(--tx);
  font-weight:600;cursor:pointer;padding-right:2px
}
.spacer{flex:1}
.tsearch{
  display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:4px;
  padding:5px 10px;width:210px;color:var(--tx-3)
}
.tsearch input{border:none;outline:none;font-family:inherit;font-size:12px;width:100%;color:var(--tx)}
.iconbtn{width:31px;height:31px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--tx-2);position:relative}
.iconbtn:hover{background:var(--paper)}
.dot{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--brick);border:1.5px solid #fff}

.page{padding:20px 22px 40px}
.phead{display:flex;align-items:flex-end;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.phead h1{font-family:var(--serif);font-size:22px;font-weight:400;letter-spacing:-.2px;line-height:1.15}
.phead p{font-size:12px;color:var(--tx-2);margin-top:3px}
.phead .acts{margin-left:auto;display:flex;gap:8px}
.btn{
  border:1px solid var(--line);background:#fff;border-radius:4px;padding:6px 12px;
  font-size:12px;font-weight:600;color:var(--tx);display:flex;align-items:center;gap:6px
}
.btn:hover{border-color:#B9BEB7;background:#FCFCFB}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
.btn.pri:hover{background:#175C40;border-color:#175C40}
.btn svg{width:13px;height:13px}

/* KPI strip: one panel, hairline divisions — not floating cards */
.kpi{background:#fff;border:1px solid var(--line);border-radius:5px;display:flex;margin-bottom:16px;overflow:hidden}
.kpi .c{flex:1;padding:14px 16px 13px;border-right:1px solid var(--line-2);min-width:0}
.kpi .c:last-child{border-right:none}
.kpi .lb{font-size:11px;color:var(--tx-2);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .vl{font-family:var(--serif);font-size:27px;line-height:1;letter-spacing:-.5px}
.kpi .vl small{font-size:14px;color:var(--tx-2);font-family:var(--sans);margin-left:2px}
.kpi .dl{font-size:10.5px;margin-top:6px;display:flex;align-items:center;gap:4px;color:var(--tx-3)}
.kpi .dl > *{margin-right:4px}
.up{color:var(--green)}.down{color:var(--brick)}

.grid{display:flex;gap:14px;margin-bottom:14px;align-items:stretch}
.grid > *{min-width:0}
.g-2 > *:first-child{flex:1.55 1 0}
.g-2 > *:nth-child(2){flex:1 1 0;display:flex;flex-direction:column}
.g-2e > *{flex:1 1 0}
.g-3 > *{flex:1 1 0}

.panel{background:#fff;border:1px solid var(--line);border-radius:5px;display:flex;flex-direction:column}
.ph{padding:12px 15px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
.ph h3{font-size:13px;font-weight:600;letter-spacing:-.1px}
.ph .hint{font-size:11px;color:var(--tx-3)}
.ph .r{margin-left:auto;display:flex;gap:10px;align-items:center}
.ph .r > *{margin-left:10px}
.ph .r > *:first-child{margin-left:0}
.pb{padding:15px}
.pb.flush{padding:0}

.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{padding:3px 9px;font-size:11px;color:var(--tx-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--ink);color:#fff;font-weight:600}

/* tables */
table{width:100%;border-collapse:collapse}
thead th{
  text-align:left;font-size:10.5px;font-weight:600;color:var(--tx-2);padding:8px 15px;
  border-bottom:1px solid var(--line);background:#FAFBFA;white-space:nowrap;letter-spacing:.1px
}
tbody td{padding:9px 15px;border-bottom:1px solid var(--line-2);font-size:12px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:#F7F9F7}
.who2{display:flex;align-items:center;gap:9px}
.who2 .av2{margin-right:9px}
.av2{width:27px;height:27px;flex:0 0 27px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:10px;font-weight:700;color:#fff;letter-spacing:.2px}
.who2 .n{font-weight:600;font-size:12px;line-height:1.25}
.who2 .m{font-size:10.5px;color:var(--tx-3)}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:3px;white-space:nowrap}
.p-rd{background:#E6F0EA;color:#17624A}
.p-cp{background:#E8EFF5;color:#2A5476}
.p-un{background:#F3F0E4;color:#7A6222}
.p-pt{background:#F2F1EE;color:#66665E}
.p-at{background:#F7EAE6;color:#8F3A26}

.lvbar{display:flex;gap:2px;align-items:center}
.lvbar i{width:13px;height:5px;border-radius:1px;background:var(--line);display:block}
.lvbar i.f{background:var(--green)}
.lvbar i.w{background:var(--brass)}
.lvbar span{font-size:10.5px;color:var(--tx-2);margin-left:5px}

.prg{height:5px;background:var(--line-2);border-radius:3px;overflow:hidden;min-width:66px}
.prg i{display:block;height:100%;background:var(--green);border-radius:3px}
.prg.w i{background:var(--brass)}
.prg.d i{background:var(--brick)}

/* geo bars */
.geo{display:flex;flex-direction:column}
.geo .row{display:flex;align-items:center;gap:11px;padding:8px 15px;border-bottom:1px solid var(--line-2);cursor:pointer}
.geo .row:hover{background:#F7F9F7}
.geo .row:last-child{border-bottom:none}
.geo .nm{width:84px;flex:0 0 84px;font-size:12px;font-weight:600}
.geo .tr{flex:1;height:16px;background:var(--line-2);border-radius:2px;overflow:hidden;display:flex}
.geo .tr i{display:block;height:100%}
.geo .pc{width:42px;text-align:right;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.geo .ct{width:54px;text-align:right;font-size:11px;color:var(--tx-3);font-variant-numeric:tabular-nums}

.lgd{display:flex;gap:14px;flex-wrap:wrap;padding:10px 15px;border-top:1px solid var(--line-2)}
.lgd span{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--tx-2);margin-right:14px}
.lgd span i{margin-right:5px}
.lgd i{width:9px;height:9px;border-radius:2px;display:block}

/* alerts */
.alert{display:flex;gap:10px;padding:11px 15px;border-bottom:1px solid var(--line-2)}
.alert:last-child{border-bottom:none}
.alert .ic{width:25px;height:25px;flex:0 0 25px;border-radius:4px;display:flex;align-items:center;justify-content:center}
.alert .ic svg{width:13px;height:13px}
.a-r{background:#F7EAE6;color:var(--brick)}
.a-w{background:#F5F1E2;color:#856A24}
.a-i{background:#E8EFF5;color:var(--blue)}
.a-g{background:#E6F0EA;color:var(--green)}
.alert .tt{font-size:12px;font-weight:600;line-height:1.3}
.alert .ds{font-size:11px;color:var(--tx-2);margin-top:2px;line-height:1.4}
.alert .tm{font-size:10px;color:var(--tx-3);margin-top:3px}

/* filter bar */
.fbar{display:flex;gap:8px;align-items:center;padding:10px 15px;border-bottom:1px solid var(--line-2);flex-wrap:wrap;background:#FCFDFC}
.fsel{border:1px solid var(--line);border-radius:4px;background:#fff;padding:5px 8px;font-family:inherit;font-size:11.5px;color:var(--tx)}
.chip{display:inline-flex;align-items:center;gap:5px;background:#E9F0EC;border:1px solid #C9DCD2;color:#17624A;
  font-size:11px;font-weight:600;padding:3px 8px;border-radius:12px}
.chip button{color:#4E7B67;font-size:13px;line-height:1;display:flex}

/* session list */
.ses{display:flex;gap:13px;padding:12px 15px;border-bottom:1px solid var(--line-2);align-items:center}
.ses:last-child{border-bottom:none}
.dbox{width:46px;flex:0 0 46px;border:1px solid var(--line);border-radius:4px;text-align:center;padding:4px 0;background:#FCFDFC}
.dbox .mo{font-size:9px;color:var(--brick);font-weight:700;letter-spacing:.4px}
.dbox .dy{font-family:var(--serif);font-size:18px;line-height:1.1}
.ses .ti{font-size:12.5px;font-weight:600}
.ses .me{font-size:11px;color:var(--tx-2);margin-top:2px}
.meetbtn{margin-left:auto;display:flex;align-items:center;gap:6px;border:1px solid var(--line);
  border-radius:4px;padding:5px 10px;font-size:11.5px;font-weight:600;background:#fff}
.meetbtn:hover{border-color:#B9BEB7}

/* drawer */
#scrim{position:fixed;inset:0;background:rgba(16,36,29,.42);opacity:0;pointer-events:none;transition:opacity .2s;z-index:90}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;width:430px;max-width:94vw;height:100vh;background:var(--paper);
  z-index:91;transform:translateX(102%);transition:transform .26s cubic-bezier(.4,0,.2,1);
  box-shadow:-8px 0 32px rgba(16,36,29,.16);overflow-y:auto}
#drawer.on{transform:none}
.dh{background:var(--ink);color:#fff;padding:17px 19px}
.dh .x{position:absolute;top:14px;right:15px;color:#9FB3A9;font-size:19px;line-height:1}
.dh .x:hover{color:#fff}
.dsec{background:#fff;border-bottom:1px solid var(--line);padding:14px 19px}
.dsec h4{font-size:11.5px;font-weight:600;color:var(--tx-2);margin-bottom:9px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--line-2);font-size:12px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--tx-2)}
.kv .v{font-weight:600;text-align:right}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.hide{display:none!important}
.gapfix > *{margin-right:10px}
.gapfix > *:last-child{margin-right:0}
.empty{padding:40px 15px;text-align:center;color:var(--tx-3);font-size:12px}
.tinylab{font-size:10.5px;color:var(--tx-3);margin-top:6px}
.mini{font-size:11px;color:var(--tx-2);line-height:1.45}
.bigq{font-family:var(--serif);font-size:15px;line-height:1.4}
.wk{display:flex;align-items:center;justify-content:space-between;padding:7px 15px;border-bottom:1px solid var(--line-2);font-size:12px}
.wk:last-child{border-bottom:none}
.wk .t{display:flex;align-items:center;gap:9px}
.wk .no{width:22px;height:22px;flex:0 0 22px;border-radius:4px;background:var(--paper);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:var(--tx-2)}
.wk .no.done{background:var(--green);border-color:var(--green);color:#fff}
.wk .no.now{background:var(--brass);border-color:var(--brass);color:#fff}
</style>
</head>

/* ============================ CHART HELPERS ============================ */
function svg(w,h,inner,extra){return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="xMidYMid meet" ${extra||""}>${inner}</svg>`}

function lineChart(series,opts){
  const w=680,h=252,pl=36,pr=12,pt=14,pb=28;
  const iw=w-pl-pr, ih=h-pt-pb;
  let all=[];series.forEach(s=>{s.d.forEach(v=>all.push(v))});
  const mx=Math.max(...all), mn=Math.min(...all);
  const lo=Math.max(0,Math.floor((mn-6)/10)*10), hi=Math.ceil((mx+4)/10)*10;
  const X=i=>pl+(i/(series[0].d.length-1))*iw;
  const Y=v=>pt+ih-((v-lo)/(hi-lo))*ih;
  let g="";
  for(let v=lo;v<=hi;v+=Math.round((hi-lo)/4)){
    g+=`<line x1="${pl}" y1="${Y(v)}" x2="${w-pr}" y2="${Y(v)}" stroke="#E9EBE6" stroke-width="1"/>`;
    g+=`<text x="${pl-7}" y="${Y(v)+3.5}" text-anchor="end" font-size="9.5" fill="#8A928C" font-family="-apple-system,sans-serif">${v}%</text>`;
  }
  series[0].d.forEach((_,i)=>{
    if(i%3===0||i===series[0].d.length-1)
      g+=`<text x="${X(i)}" y="${h-8}" text-anchor="middle" font-size="9.5" fill="#8A928C" font-family="-apple-system,sans-serif">W${i+1}</text>`;
  });
  series.forEach(s=>{
    const pts=s.d.map((v,i)=>`${X(i)},${Y(v)}`).join(" ");
    if(s.fill){
      g+=`<polygon points="${pl},${pt+ih} ${pts} ${w-pr},${pt+ih}" fill="${s.c}" opacity=".10"/>`;
    }
    g+=`<polyline points="${pts}" fill="none" stroke="${s.c}" stroke-width="${s.wd||2.2}" stroke-linejoin="round" stroke-linecap="round" ${s.dash?'stroke-dasharray="4 3"':''}/>`;
    s.d.forEach((v,i)=>{ if(i===s.d.length-1) g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="3.6" fill="#fff" stroke="${s.c}" stroke-width="2.2"/>`});
  });
  return svg(w,h,g);
}

function stackedLevels(lv,label){
  const w=680,h=54;
  const tot=lv.reduce((a,b)=>a+b,0);
  const cols=["#D7DCD8","#BFCBC4","#B8863B","#3D8A66","#1B6B4A"];
  let x=0,g="";
  lv.forEach((v,i)=>{
    const bw=(v/tot)*w;
    g+=`<rect x="${x}" y="0" width="${Math.max(bw-1.5,1)}" height="26" fill="${cols[i]}" rx="2"/>`;
    if(bw>52) g+=`<text x="${x+bw/2}" y="17.5" text-anchor="middle" font-size="11" font-weight="700" fill="${i>=3?'#fff':'#4A524D'}" font-family="-apple-system,sans-serif">${Math.round(v/tot*100)}%</text>`;
    g+=`<text x="${x}" y="45" font-size="9.5" fill="#8A928C" font-family="-apple-system,sans-serif">${bw>68?LVNAME[i]:''}</text>`;
    x+=bw;
  });
  return svg(w,h,g);
}

function groupedBars(rows){
  const w=680,h=292,pl=126,pr=46,pt=10,pb=24;
  const iw=w-pl-pr;
  const rh=(h-pt-pb)/rows.length;
  let g="";
  [0,25,50,75,100].forEach(v=>{
    const x=pl+(v/100)*iw;
    g+=`<line x1="${x}" y1="${pt}" x2="${x}" y2="${h-pb+2}" stroke="#E9EBE6"/>`;
    g+=`<text x="${x}" y="${h-6}" text-anchor="middle" font-size="9.5" fill="#8A928C" font-family="-apple-system,sans-serif">${v}</text>`;
  });
  rows.forEach((r,i)=>{
    const y=pt+i*rh;
    g+=`<text x="${pl-9}" y="${y+rh/2+3.5}" text-anchor="end" font-size="11" fill="#17201C" font-family="-apple-system,sans-serif">${r[0]}</text>`;
    g+=`<rect x="${pl}" y="${y+rh/2-13}" width="${(r[1]/100)*iw}" height="11" fill="#C6CFC9" rx="1.5"/>`;
    g+=`<rect x="${pl}" y="${y+rh/2+1}" width="${(r[2]/100)*iw}" height="11" fill="#1B6B4A" rx="1.5"/>`;
    g+=`<text x="${pl+(r[2]/100)*iw+7}" y="${y+rh/2+10}" font-size="10.5" font-weight="700" fill="#1B6B4A" font-family="-apple-system,sans-serif">+${r[2]-r[1]}</text>`;
  });
  return svg(w,h,g);
}

function donut(pct,lab){
  const r=52,c=2*Math.PI*r;
  return svg(150,150,`
    <circle cx="75" cy="75" r="${r}" fill="none" stroke="#E9EBE6" stroke-width="15"/>
    <circle cx="75" cy="75" r="${r}" fill="none" stroke="#1B6B4A" stroke-width="15" stroke-linecap="round"
      stroke-dasharray="${c*pct/100} ${c}" transform="rotate(-90 75 75)"/>
    <text x="75" y="72" text-anchor="middle" font-size="30" fill="#17201C" font-family="Georgia,serif">${pct}%</text>
    <text x="75" y="90" text-anchor="middle" font-size="10.5" fill="#5C6560" font-family="-apple-system,sans-serif">${lab}</text>`);
}

PAGES.geography=()=>{
  const st=DRILL.state, lg=DRILL.lga, wd=DRILL.ward;
  let level="State", rows, backBar="";
  if(wd){
    level="Polling unit"; rows=(PUS[wd]||PUS["Gwammaja"]).map(r=>({n:r[0],e:r[1],r:r[2]}));
  } else if(lg){
    level="Ward / Registration Area"; rows=(WARDS[lg]||WARDS["Dala"]).map(r=>({n:r[0],e:r[1],r:r[2],next:"ward"}));
  } else if(st){
    level="Local Government Area"; rows=(LGAS[st]||[]).map(r=>({n:r[0],e:r[1],r:r[2],next:"lga"}));
  } else {
    level="State"; rows=STATES.map(s=>({n:s.s,e:s.enrolled,r:s.ready,next:"state"}));
  }
  const tot=rows.reduce((a,b)=>a+b.e,0), rdy=rows.reduce((a,b)=>a+b.r,0);
  const path=[["National",()=>{DRILL={state:null,lga:null,ward:null};render()}]];
  if(st)path.push([st,()=>{DRILL={state:st,lga:null,ward:null};render()}]);
  if(lg)path.push([lg,()=>{DRILL={state:st,lga:lg,ward:null};render()}]);
  if(wd)path.push([wd,()=>{}]);

  CHARTQ.geodonut=()=>donut(Math.round(rdy/tot*100),"ready");

  return `
  <div class="phead">
    <div><h1>Geographic breakdown</h1>
    <p>Drill from state through local government and ward to an individual polling unit</p></div>
    <div class="acts"><button class="btn">Export this view</button></div>
  </div>

  <div class="panel" style="margin-bottom:14px">
    <div class="fbar">
      <div style="display:flex;align-items:center;gap:7px;font-size:12px">
        ${path.map((p,i)=>`${i?'<span style="color:var(--tx-3)">›</span>':''}
          <button onclick="geoJump(${i})" style="font-weight:${i===path.length-1?700:500};color:${i===path.length-1?'var(--tx)':'var(--green)'}">${p[0]}</button>`).join("")}
      </div>
      <div style="margin-left:auto;display:flex;gap:16px;font-size:11.5px;color:var(--tx-2)">
        <span style="margin-right:16px">Enrolled <b class="num" style="color:var(--tx)">${fm(tot)}</b></span>
        <span style="margin-right:16px">Ready <b class="num" style="color:var(--green)">${fm(rdy)}</b></span>
        <span>Rate <b class="num" style="color:var(--tx)">${Math.round(rdy/tot*100)}%</b></span>
      </div>
    </div>
  </div>

  <div class="grid g-2">
    <div class="panel">
      <div class="ph"><h3>${level} level</h3><div class="r"><span class="hint">${rows.length} record${rows.length===1?'':'s'}${wd?'':' · select a row to drill down'}</span></div></div>
      <div class="geo">
        ${rows.map(r=>{const p=Math.round(r.r/r.e*100);
          const col=p>=80?"#1B6B4A":p>=70?"#3D8A66":p>=60?"#B8863B":"#A8432C";
          const act=r.next?`onclick="geoDown('${r.next}','${r.n.replace(/'/g,"")}')"`:'';
          return `<div class="row" ${act} style="${r.next?'':'cursor:default'}">
            <div class="nm" style="width:${wd?200:110}px;flex:0 0 ${wd?200:110}px">${r.n}</div>
            <div class="tr"><i style="width:${p}%;background:${col}"></i></div>
            <div class="pc">${p}%</div><div class="ct">${fm(r.e)}</div>
            ${r.next?'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8A928C" stroke-width="2.4"><path d="M9 18l6-6-6-6"/></svg>':'<span style="width:13px"></span>'}
          </div>`}).join("")}
      </div>
      <div class="lgd"><span><i style="background:#1B6B4A"></i>80%+</span><span><i style="background:#3D8A66"></i>70–79%</span><span><i style="background:#B8863B"></i>60–69%</span><span><i style="background:#A8432C"></i>Below 60%</span></div>
    </div>
    <div>
      <div class="panel" style="margin-bottom:14px">
        <div class="ph"><h3>Readiness at this level</h3></div>
        <div class="pb" style="display:flex;justify-content:center" data-chart="geodonut"></div>
        <div style="padding:0 15px 15px"><p class="mini">${fm(rdy)} of ${fm(tot)} participants in ${path[path.length-1][0]} have reached Level 5 and are eligible for certification.</p></div>
      </div>
      <div class="panel">
        <div class="ph"><h3>Coverage</h3></div>
        <div class="pb">
          <div class="kv"><span class="k">States and territories</span><span class="v num">37</span></div>
          <div class="kv"><span class="k">Local government areas</span><span class="v num">774</span></div>
          <div class="kv"><span class="k">Wards / registration areas</span><span class="v num">8,809</span></div>

          <div class="kv"><span class="k">Units with an enrolled participant</span><span class="v num">41,207</span></div>

      </div>
    </div>
  </div>`;
};

      <div class="panel" style="margin-bottom:14px">
        <div class="ph"><h3>Agreement between system score and trainer</h3></div>
        <div class="pb" data-chart="aiacc"></div>
        <div style="padding:0 15px 14px"><p class="mini">Where a trainer confirms the system score without adjustment. Rising agreement reduces review time, but every Level 5 decision still requires a trainer.</p></div>
      </div>
      <div class="panel">
        <div class="ph"><h3>Assessment types in use</h3></div>
        <div class="pb">
          <div class="kv"><span class="k">Weekly knowledge quizzes</span><span class="v num">16 per track</span></div>
          <div class="kv"><span class="k">Scenario drills</span><span class="v num">64 variants</span></div>
          <div class="kv"><span class="k">Practical checklists</span><span class="v num">5 role-specific</span></div>
          <div class="kv"><span class="k">Mock election roles</span><span class="v num">9 assignable</span></div>
          <div class="kv"><span class="k">Final assessment parts</span><span class="v num">3</span></div>
        </div>
      </div>

};

PAGES.certification=()=>{

  return `

  <div class="kpi">

    <div class="c"><div class="lb">Certification rate</div><div class="vl num">${Math.round(NATIONAL.rd/NATIONAL.e*100)}<small>%</small></div><div class="dl">of enrolled participants</div></div>
    <div class="c"><div class="lb">Verification lookups</div><div class="vl num">2,318</div><div class="dl">since cycle opened</div></div>

  <div class="panel">
    <div class="fbar">

        <td class="num" style="font-size:11.5px">PR-C3-${String(4820+i)}-${p.state.slice(0,2).toUpperCase()}</td>
        <td>${p.track}</td>
        <td><div style="font-size:11.5px">${p.ward}, ${p.lga}</div><div style="font-size:10.5px;color:var(--tx-3)">${p.state}</div></td>

        <td style="font-size:11.5px;color:var(--tx-2);white-space:nowrap">${p.trainer}</td>
        <td style="font-size:11.5px;color:var(--tx-2)" class="num">${8+(i%6)} Sep 2026</td>
        <td><span class="pill p-rd">Issued</span></td>
      </tr>`).join("")}
      </tbody>
    </table>
  </div>`;
};

PAGES.cohorts=()=>{
  const co=[];
  STATES.forEach((s,i)=>{
    const lg=LGAS[s.s];
    for(let c=1;c<=(i<4?3:2);c++){
      co.push({id:s.s.split(" ")[0].toUpperCase().slice(0,3)+"-C"+c, st:s.s,
        area:lg.slice((c-1)*2,(c-1)*2+2).map(x=>x[0]).join(" &amp; "),
        n:Math.round(s.enrolled/((i<4?3:2)*1.0)/ (i<4?1:1)),
        tr:TRAINERS[(i+c)%TRAINERS.length], wk:[11,9,13,8,12,10][(i+c)%6],
        rate:Math.round(s.ready/s.enrolled*100)+((c%2)?-3:2)});
    }
  });
  return `
  <div class="phead">
    <div><h1>Cohorts and trainers</h1><p>${co.length} active cohorts · 64 trainers · cycle 3</p></div>
    <div class="acts"><button class="btn">Reassign trainer</button><button class="btn pri">Create cohort</button></div>
  </div>
  <div class="panel">
    <table>
      <thead><tr><th>Cohort</th><th>Coverage</th><th>Participants</th><th>Assigned trainer</th><th>Current week</th><th>Progress</th><th>Readiness rate</th><th>Status</th></tr></thead>
      <tbody>
      ${co.map(c=>`<tr class="click">
        <td style="font-weight:700" class="num">${c.id}</td>
        <td><div style="font-size:11.5px">${c.area}</div><div style="font-size:10.5px;color:var(--tx-3)">${c.st}</div></td>
        <td class="num">${fm(c.n)}</td>
        <td><div class="who2"><div class="av2" style="background:${AVC[c.tr.length%7]};width:23px;height:23px;flex:0 0 23px;font-size:9px">${initials(c.tr)}</div><span style="font-size:11.5px">${c.tr}</span></div></td>
        <td class="num">Week ${c.wk}</td>
        <td><div class="prg ${c.wk<9?'d':c.wk<13?'w':''}"><i style="width:${Math.round(c.wk/16*100)}%"></i></div></td>
        <td class="num" style="font-weight:600;color:${c.rate>=78?'#1B6B4A':c.rate>=65?'#856A24':'#A8432C'}">${c.rate}%</td>
        <td><span class="pill ${c.wk>=13?'p-rd':c.wk>=9?'p-cp':'p-un'}">${c.wk>=13?'Readiness phase':c.wk>=9?'On schedule':'Behind'}</span></td>
      </tr>`).join("")}
      </tbody>
    </table>
  </div>`;
};

/* ============================ INTERACTION ============================ */
function geoDown(kind,name){
  if(kind==="state"){DRILL={state:name,lga:null,ward:null}}
  else if(kind==="lga"){DRILL.lga=name;DRILL.ward=null}
  else if(kind==="ward"){DRILL.ward=name}
  render();
}
function geoJump(i){
  if(i===0)DRILL={state:null,lga:null,ward:null};
  if(i===1)DRILL={state:DRILL.state,lga:null,ward:null};
  if(i===2)DRILL={state:DRILL.state,lga:DRILL.lga,ward:null};
  render();
}
function openState(s){CUR="geography";DRILL={state:s,lga:null,ward:null};drawNav();render()}

function openPerson(i){
  const p=PEOPLE[i];
  const weeks=[];
  for(let w=1;w<=16;w++){
    const done=w<p.wk, now=w===p.wk;
    weeks.push(`<div class="wk"><div class="t"><div class="no ${done?'done':now?'now':''}">${done?'✓':w}</div>
      <span style="color:${done?'var(--tx)':now?'var(--tx)':'var(--tx-3)'}">${WEEKT[w-1]}</span></div>
      <span style="font-size:11px;color:var(--tx-3)" class="num">${done?(62+((w*7+i)%34))+'%':now?'in progress':'—'}</span></div>`);
  }
  document.getElementById("drawer").innerHTML=`
    <div class="dh" style="position:relative">
      <button class="x" onclick="closeDrawer()">✕</button>
      <div style="display:flex;gap:12px;align-items:center">
        <div class="av2" style="background:${p.c};width:44px;height:44px;flex:0 0 44px;font-size:15px">${initials(p.name)}</div>
        <div><div style="font-family:var(--serif);font-size:18px">${p.name}</div>
        <div style="font-size:11.5px;color:#9FB3A9;margin-top:2px">${p.id} · ${p.track} · ${p.cohort}</div></div>
      </div>
      <div style="display:flex;gap:20px;margin-top:15px">
        <div><div style="font-size:10.5px;color:#7F9689">Level</div><div style="font-family:var(--serif);font-size:20px">${p.lv}<span style="font-size:12px;color:#9FB3A9">/5</span></div></div>
        <div><div style="font-size:10.5px;color:#7F9689">Score</div><div style="font-family:var(--serif);font-size:20px">${p.score}%</div></div>
        <div><div style="font-size:10.5px;color:#7F9689">Improvement</div><div style="font-family:var(--serif);font-size:20px;color:#7FD4A8">+${p.score-p.base}</div></div>
        <div><div style="font-size:10.5px;color:#7F9689">Attendance</div><div style="font-family:var(--serif);font-size:20px">${p.att}%</div></div>
      </div>
    </div>
    <div class="dsec">
      <h4>Deployment assignment</h4>
      <div class="kv"><span class="k">State</span><span class="v">${p.state}</span></div>
      <div class="kv"><span class="k">Local government area</span><span class="v">${p.lga}</span></div>
      <div class="kv"><span class="k">Ward / registration area</span><span class="v">${p.ward}</span></div>
      <div class="kv"><span class="k">Polling unit</span><span class="v">${p.pu}</span></div>
      <div class="kv"><span class="k">Assigned trainer</span><span class="v">${p.trainer}</span></div>
    </div>
    <div class="dsec">
      <h4>Competency level</h4>
      ${[1,2,3,4,5].map(l=>`<div class="kv"><span class="k" style="display:flex;align-items:center;gap:7px">
        <span style="width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;
        background:${l<=p.lv?'#1B6B4A':'#E9EBE6'};color:${l<=p.lv?'#fff':'#8A928C'}">${l<=p.lv?'✓':l}</span>${LVNAME[l-1]}</span>
        <span class="v" style="color:${l<=p.lv?'var(--green)':'var(--tx-3)'};font-weight:${l<=p.lv?600:400}">${l<=p.lv?'Achieved':'Not yet'}</span></div>`).join("")}
      ${p.lv<5?`<p class="mini" style="margin-top:9px">Certification requires Level 5. Outstanding: ${5-p.lv} level${5-p.lv>1?'s':''}.</p>`:
      `<p class="mini" style="margin-top:9px;color:var(--green);font-weight:600">Eligible for certification — confirmed by ${p.trainer}.</p>`}
    </div>
    <div class="dsec">
      <h4>Weak areas identified by the correction stage</h4>
      ${(p.lv>=4?[WEAK[4]]:[WEAK[0],WEAK[1],WEAK[3]]).map(w=>`
        <div style="padding:7px 0;border-bottom:1px solid var(--line-2)">
          <div style="font-size:12px;font-weight:600">${w[0]}</div>
          <div class="mini" style="margin-top:2px">${w[3]}</div>
        </div>`).join("")}
    </div>
    <div class="dsec" style="border-bottom:none">
      <h4>Programme record — 16 weeks</h4>
      <div style="border:1px solid var(--line);border-radius:4px;overflow:hidden">${weeks.join("")}</div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn" style="flex:1;justify-content:center">Message participant</button>
        <button class="btn pri" style="flex:1;justify-content:center">${p.lv===5?'Issue certificate':'Flag for support'}</button>
      </div>
    </div>`;
  document.getElementById("drawer").classList.add("on");
  document.getElementById("scrim").classList.add("on");
}
function closeDrawer(){
  document.getElementById("drawer").classList.remove("on");
  document.getElementById("scrim").classList.remove("on");
}
const WEEKT=["Electoral process end-to-end","Polling unit agents","Security personnel","Results journey to collation",
"What BVAS is","BVAS operation before use","BVAS troubleshooting","BVAS care and security",
"A complete polling day","Counting and documentation","Ward collation","Local government collation",
"BVAS practical session","Mock election exercise","Pressure and disputes","Final assessment"];

document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer()});
drawNav();render();
</script>
